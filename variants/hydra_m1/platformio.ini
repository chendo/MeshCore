; ThinkNode M1 builds that belong to this fork.
;
; Nothing here is a board definition. variants/thinknode_m1/platformio.ini stays
; as upstream ships it, and every env below extends it: [ThinkNode_M1] for the
; board, or [env:ThinkNode_M1_*] for a stock env we add flags to. `extends`
; resolves across files because PlatformIO merges every entry of [platformio]
; extra_configs into one configuration before it evaluates anything, and the
; glob variants/*/platformio.ini picks this directory up with no change to any
; existing file.
;
; The one thing this fork still carries inside variants/thinknode_m1/ is the LED
; pin fix in variant.h and variant.cpp, which is an upstream bug and is on its
; own branch for submission. Build configuration does not belong there.

; The stock repeater, plus the two watchdogs.
;
; It extends the upstream env rather than the board section, so an upstream
; change to ThinkNode_M1_repeater reaches this build without being copied.
;
; WITH_STATUS_LED is absent on purpose. StatusLed drives a blue and a green LED
; with hardware PWM. The M1 has no green LED: it has blue on P0.13, which
; ThinkNodeM1Board already lights for each LoRa transmit and which Bluefruit
; also blinks while it advertises, and red on P1.04, which the charger drives in
; hardware. So neither LED is free and neither pair matches the StatusLed API.
;
; This is worth revisiting now that the pin definitions are correct. Until the
; pin-37 and LED patches landed, variants/thinknode_m1/variant.h carried
; lilygo_techo values that named a green LED the board does not have and put
; LED_RED on PIN_SPI1_MISO.
[env:ThinkNode_M1_repeater_hardened]
extends = env:ThinkNode_M1_repeater
build_flags =
  ${env:ThinkNode_M1_repeater.build_flags}
  -D LOOP_WATCHDOG_MS=30000
  -D LORA_WATCHDOG_MS=900000       ; probe the radio after 15 min with no airtime
build_src_filter = ${env:ThinkNode_M1_repeater.build_src_filter}
  +<helpers/nrf52/LoopWatchdog.cpp>

; Hydra: several mesh identities over one LoRa radio (examples/hydra).
; The M1 carries the same nRF52840, the same SoftDevice s140 6.1.1 and the same
; 235,520 B of RAM as the RAK3401, so this env is the RAK3401 hydra env with M1
; pins. Slot 0 is the stock simple_repeater MyMesh, reused as-is: its MyMesh.cpp
; is compiled in and its directory is put on the include path. Its main.cpp is
; excluded, because hydra brings its own setup() and loop().
;
; Deliberately NOT set here:
; The M1's e-paper panel now drives the neighbours screen. Unlike the M5, the
; [ThinkNode_M1] base does NOT set DISPLAY_CLASS -- only the two companion envs
; do -- so this env has to bring the whole display stack itself: the class, the
; rotation, GxEPDDisplay.cpp and GxEPD2. The screen is NODE-scope: it reports
; the peer table the shared radio builds from every frame the board hears, so it
; says nothing about any one identity's preferences. That was the thing a
; multi-identity node had no answer for.
;
; Deliberately NOT set here:
;   WITH_STATUS_LED  - the M1 has one LED that this firmware can own. See the
;                      ThinkNode_M1_repeater_hardened env above.
;
; A slot allocates its ACL and its post buffer on the heap when the operator
; enables it, so a configured but inactive room costs nothing. HYDRA_RAM_RESERVE
; is the floor that refuses the last slot when the heap cannot carry it.
[env:ThinkNode_M1_hydra]
extends = ThinkNode_M1
build_flags =
  ${ThinkNode_M1.build_flags}
  -I examples/simple_repeater
  -I src/helpers/ui
  -D DISPLAY_ROTATION=4
  -D DISPLAY_CLASS=GxEPDDisplay
  -D ADVERT_NAME='"ThinkNode M1 Hydra"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D HYDRA_NUM_SLOTS=3             ; slot 0 repeater + 2 chat-capable slots
  -D HYDRA_NAME_PREFIX='"hydra"'
  -D MAX_NEIGHBOURS=50             ; slot 0 only (repeater)
  -D MAX_CLIENTS=32                ; slot 0's ACL, and each room slot's own
  -D MAX_UNSYNCED_POSTS=32         ; per room slot, RAM only
  -D HYDRA_RAM_RESERVE=24576       ; node floor: a slot that would breach it is refused
  -D MAX_CONTACTS=16               ; chat slots: stock companion is 350
  -D MAX_CONNECTIONS=4             ; chat slots: stock is 16
  -D HYDRA_CHAT_POOL=8             ; 8 x sizeof(mesh::Packet)=262B vs 32 for slot 0
  -D HYDRA_CHAT_HASHES=32          ; dedup table; SimpleMeshTables uses 160
  ; The BLE companion facade: the MeshCore phone app can administer every
  ; identity on this node with no LoRa airtime, and the same link carries the
  ; text CLI. See examples/hydra/HydraCompanion.h. Do NOT combine this with the
  ; BLE bridge: there is one BLE stack on the board and the bridge owns it.
  -D WITH_COMPANION_BLE=1
  -D BLE_PIN_CODE=123456
  -D LOOP_WATCHDOG_MS=30000
  ; Clock convergence: how often the node asks its neighbours what the time is.
  ; Defining this compiles the feature in. It stays OFF until "clocks on", so a
  ; build that carries it does not steer anything by accident. Leave it undefined
  ; and none of it is built. See src/helpers/ClockPolicy.h.
  -D CLOCK_CONVERGE_MS=300000
  ; Node-scoped (HydraNode), from SharedRadioCore::airtimeMs(), and it probes
  ; with the identity of slot 0. One watchdog for the board, not one per slot.
  -D LORA_WATCHDOG_MS=900000
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${ThinkNode_M1.build_src_filter}
  +<helpers/nrf52/LoopWatchdog.cpp>
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<helpers/companion/CompanionFacade.cpp>
  +<helpers/AppModule.cpp>
  +<helpers/ui/GxEPDDisplay.cpp>
  +<helpers/ObserverNeighbours.cpp>
  +<helpers/ui/NeighboursScreen.cpp>
  +<../examples/hydra>
  +<../examples/simple_repeater/MyMesh.cpp>
lib_deps =
  ${ThinkNode_M1.lib_deps}
  zinggjm/GxEPD2 @ 1.6.2
  bakercp/CRC32 @ ^2.0.0

; A repeater that bridges over BLE peer links. Two co-located nodes that run
; this build with the same `bridge.secret` share their LoRa traffic over a BLE
; connection, and they spend no LoRa hop to do it. The M1 has no WiFi, so
; ${bridge.espnow} is not available to it.
;
; Discovery: each node advertises a legacy beacon that carries a two-byte group
; marker derived from the secret, and it dials a node whose beacon matches. The
; marker is public, so the group HMAC on the first frame is what proves
; membership. See src/helpers/bridges/BLEBridge.h.
;
; The frame is PLAINTEXT and authenticated with a truncated HMAC -- see
; src/helpers/bridges/BleBridgeFrame.h. Set the same `bridge.secret` on every
; node in the group; a different secret is what keeps two groups apart.
;
; This bridge owns the BLE stack, so do NOT add a BLE CLI or a companion
; interface to this env. A build that does add one must also set
; -D BLE_LINK_SILENT_SWEEP=0, because the sweep that reclaims the inbound slot
; cannot tell a silent peer from a CLI client that is part way through pairing.

[env:ThinkNode_M1_hydra_bridge_ble]
; Hydra on the M1, bridging over BLE to the M5. The pair this transport exists
; for: this board on Australia (Narrow), the M5 on Australia (Mid).
;
; Same story as ThinkNode_M5_hydra_bridge_ble and no new code either.
; RepeaterSlot holds a RepeaterMesh, RepeaterMesh derives from
; simple_repeater's MyMesh, and MyMesh already carries `BRIDGE_CLASS bridge`
; with getBridge(), a begin() that starts it and a loop() that pumps it. So
; slot 0 bridges the moment BRIDGE_CLASS is defined, and the other two slots
; are unaffected -- they share the one radio, as they always did.
;
; The companion facade is OFF and must stay off: one BLE stack, and the bridge
; owns it. Bluefruit is the backend here, so unlike the M5 there is no second
; stack to keep out -- only the facade's own SerialBLEInterface to subtract.
extends = env:ThinkNode_M1_hydra
build_unflags =
  ${env:ThinkNode_M1_hydra.build_unflags}
  -D WITH_COMPANION_BLE=1
build_flags =
  ${env:ThinkNode_M1_hydra.build_flags}
  ${bridge.ble}
  -D BLE_PRPH_SLOTS=2
  -D BLE_CENTRAL_SLOTS=2
build_src_filter = ${env:ThinkNode_M1_hydra.build_src_filter}
  -<helpers/nrf52/SerialBLEInterface.cpp>
  -<helpers/companion/CompanionFacade.cpp>
  +<helpers/nrf52/BleStack.cpp>
  +<helpers/nrf52/BleDiscovery.cpp>
  +<helpers/nrf52/BluefruitLinkBackend.cpp>
  +<helpers/bridges/BleLink.cpp>
  +<helpers/bridges/BLEBridge.cpp>

[env:ThinkNode_M1_repeater_bridge_ble]
extends = ThinkNode_M1
build_flags =
  ${ThinkNode_M1.build_flags}
  ${bridge.ble}
  -D ADVERT_NAME='"ThinkNode M1 BLE Bridge"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  ; The M1 grants the same slots as the RAK3401. Both boards link with
  ; boards/nrf52840_s140_v6.ld, so the SoftDevice gets the same 24KB at RAM
  ; origin 0x20006000, and both run s140 6.1.1. BleStack::ensure() still finds
  ; the true ceiling at boot and steps down to what fits, so these two numbers
  ; are a request and never an assumption. Peripheral 2: the CLI/DFU port, plus
  ; one slot for a peer that dials IN, because the address tie-break means the
  ; higher address must be able to accept. Central 2: one outward link is all a
  ; two-node bridge needs, with one spare.
  -D BLE_PRPH_SLOTS=2
  -D BLE_CENTRAL_SLOTS=2
  -D LOOP_WATCHDOG_MS=30000
  -D LORA_WATCHDOG_MS=900000       ; probe the radio after 15 min with no airtime
;  -D BRIDGE_DEBUG=1
;  -D BLE_DISCOVERY_DEBUG_LOGGING=1
build_src_filter = ${ThinkNode_M1.build_src_filter}
  +<helpers/nrf52/LoopWatchdog.cpp>
  +<helpers/nrf52/BleStack.cpp>
  +<helpers/nrf52/BleDiscovery.cpp>
  +<helpers/bridges/BleLink.cpp>
  +<helpers/nrf52/BluefruitLinkBackend.cpp>
  +<helpers/bridges/BLEBridge.cpp>
  +<../examples/simple_repeater/*.cpp>
lib_deps =
  ${ThinkNode_M1.lib_deps}
