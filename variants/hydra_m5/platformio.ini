; ThinkNode M5 builds that belong to this fork.
;
; Nothing here is a board definition. variants/thinknode_m5/platformio.ini stays
; as upstream ships it, and every env below extends it: [ThinkNode_M5] for the
; board, or [env:ThinkNode_M5_*] for a stock env we add flags to. `extends`
; resolves across files because PlatformIO merges every entry of [platformio]
; extra_configs into one configuration before it evaluates anything, and the
; glob variants/*/platformio.ini picks this directory up with no change to any
; existing file.

; The stock repeater, plus the LoRa watchdog.
;
; It extends the upstream env rather than the board section, so an upstream
; change to ThinkNode_M5_Repeater reaches this build without being copied.
;
; LOOP_WATCHDOG_MS is absent on purpose. LoopWatchdog is nRF52 code and it drives
; the WDT peripheral of that part. The ESP32 has its own task watchdog, and a
; port belongs in src/helpers/esp32, not in a build flag here.
;
; WITH_STATUS_LED is absent on purpose. The LEDs of the M5 hang on the PCA9557
; I2C expander, and ThinknodeM5Board reaches them with expander.digitalWrite().
; StatusLed writes pinMode() and analogWrite() to a GPIO, and it needs two LEDs
; that it can own. Neither condition holds here: the expander carries no PWM, and
; the blue LED on expander pin 1 is already the LoRa transmit indicator of the
; board. PIN_STATUS_LED in variants/thinknode_m5/variant.h stays commented out
; for the same reason.
[env:ThinkNode_M5_Repeater_hardened]
extends = env:ThinkNode_M5_Repeater
build_flags =
  ${env:ThinkNode_M5_Repeater.build_flags}
  -D LORA_WATCHDOG_MS=900000       ; probe the radio after 15 min with no airtime

; Hydra: several mesh identities over one LoRa radio (examples/hydra).
; Slot 0 is the stock simple_repeater MyMesh, reused as-is: its MyMesh.cpp is
; compiled in and its directory is put on the include path. Its main.cpp is
; excluded, because hydra brings its own setup() and loop().
;
; The portable parts of hydra run here. SharedRadio, MeshObserver, LoraWatchdog
; and the slot code hold no nRF52 code. LoopWatchdog and I2CBusRecovery are
; nRF52 only, and examples/hydra/main.cpp compiles them only when the build asks
; for them, so this env leaves LOOP_WATCHDOG_MS unset. The Bluetooth bridge
; needs the SoftDevice, so the M5 cannot have it; ${bridge.espnow} is the
; counterpart that this board can run.
;
; Deliberately NOT set here:
;   DISPLAY_CLASS    - the base env sets it, and build_unflags takes it away
;                      again. PlatformIO emits every -D after every -U, so a -U
;                      in build_flags cannot cancel a -D from the parent, and
;                      build_unflags is the only mechanism that works. The M5 has
;                      an e-paper panel, but hydra has no UI yet. A display that
;                      shows the preferences of one identity on a multi-identity
;                      node needs a design first. This also keeps GxEPD2 and its
;                      fonts out of the image.
;   WITH_STATUS_LED  - the LEDs of the M5 hang on the PCA9557 expander, not on a
;                      GPIO. StatusLed writes pinMode and analogWrite, and no
;                      hardware PWM reaches an I2C expander. See the
;                      ThinkNode_M5_Repeater_hardened env above.
[env:ThinkNode_M5_hydra]
extends = ThinkNode_M5
; The stock table for 4 MB parts gives each OTA slot 0x140000 = 1,310,720 B, and
; ThinkNode_M5_Repeater already fills 85.9% of one. min_spiffs.csv is a stock
; table of the platform, and four variants in this tree already use it. It moves
; each OTA slot to 0x1E0000 = 1,966,080 B and leaves the SPIFFS at 0x20000 =
; 131,072 B, which is far more than the identities, the preferences, the ACLs
; and /hydra_slots need. huge_app.csv would give 3 MB, but it deletes the second
; OTA slot, and a repeater on a mast is exactly the node that needs to accept an
; over-the-air image. Headroom is worth less than a way back in.
;
; WARNING. This line is not only a size. It moves SPIFFS from 0x290000 to
; 0x3D0000. A board that goes from a stock-table env to this one, or back, finds
; no filesystem at the new address, formats it, and mints new keys. Every
; identity, prefs.json, each ACL and /hydra_slots are orphaned, with no error
; and no prompt. Save the keys with `get prv.key` and `slot N get prv.key`
; BEFORE you flash across a table change. NVS stays at 0x9000 in every stock
; table, but hydra writes nothing there, so it holds no copy. See
; docs/hydra.md, "Changing the partition table destroys the filesystem".
board_build.partitions = min_spiffs.csv
build_unflags = -D DISPLAY_CLASS=GxEPDDisplay
build_flags =
  ${ThinkNode_M5.build_flags}
  -I examples/simple_repeater
  -D ADVERT_NAME='"ThinkNode M5 Hydra"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  ; Five slots, against three on the nRF52 boards. The ESP32-S3 has 524,288 B of
  ; SRAM against 235,520 B. A chat slot costs 9,096 B of static RAM here, which
  ; is 1.7% of this part, where the 5,640 B of an nRF52 slot is 2.4% of that
  ; part. The two extra slots thus cost 18,192 B and 4 B of flash. Above five the
  ; antenna, and not the RAM, is the limit: slot 0 already forwards every flood
  ; that this radio hears, and each extra identity adds only its own advert
  ; schedule to one half-duplex antenna.
  -D HYDRA_NUM_SLOTS=5             ; slot 0 repeater + 4 chat-capable slots
  -D HYDRA_NAME_PREFIX='"hydra"'
  ; WiFi: the S3 has a radio, so hydra compiles the console in unconditionally.
  ; Credentials are runtime state (`wifi.ssid` / `wifi.pwd`), kept in NVS -- not
  ; build flags, so no password lands in git and one image serves every site.
  -D WIFI_CONSOLE_PORT=4403
  -D WIFI_NTP_SERVER='"au.pool.ntp.org"'
  -D MAX_NEIGHBOURS=50             ; slot 0 only (repeater)
  -D MAX_CLIENTS=32                ; slot 0's ACL, and each room slot's own
  ; The dials below are wider than the nRF52 ones, because the RAM allows it.
  -D MAX_UNSYNCED_POSTS=64         ; per room slot, RAM only
  -D HYDRA_RAM_RESERVE=32768       ; node floor: a slot that would breach it is refused
  -D MAX_CONTACTS=32               ; chat slots: stock companion is 350
  -D MAX_CONNECTIONS=8             ; chat slots: stock is 16
  -D HYDRA_CHAT_POOL=12            ; 12 x sizeof(mesh::Packet)=262B vs 32 for slot 0
  -D HYDRA_CHAT_HASHES=64          ; dedup table; SimpleMeshTables uses 160
  ; Clock convergence: how often the node asks its neighbours what the time is.
  ; Defining this compiles the feature in. It stays OFF until "clocks on", so a
  ; build that carries it does not steer anything by accident. Leave it undefined
  ; and none of it is built. See src/helpers/ClockPolicy.h. The rules and the
  ; plumbing hold no nRF52 code: ClockPolicy.h is integer arithmetic, and
  ; HydraNode::loopClockConverge() reads millis() and the mesh::RTCClock of the
  ; target. On this board that clock is ESP32RTCClock behind AutoDiscoverRTCClock,
  ; and it starts at the same 2024 default that clockIsUnset() looks for.
  -D CLOCK_CONVERGE_MS=300000
  ; Node-scoped (HydraNode), from SharedRadioCore::airtimeMs(), and it probes
  ; with the identity of slot 0. One watchdog for the board, not one per slot.
  -D LORA_WATCHDOG_MS=900000
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${ThinkNode_M5.build_src_filter}
  +<helpers/esp32/WifiConsole.cpp>
  -<helpers/ui/GxEPDDisplay.cpp>
  +<../examples/hydra>
  +<../examples/simple_repeater/MyMesh.cpp>
lib_deps =
  ${ThinkNode_M5.lib_deps}
  ${esp32_ota.lib_deps}

; A repeater that bridges over BLE peer links, on NimBLE.
;
; This is the ONLY transport that joins an nRF52 node to an ESP32 one. An nRF52
; board has no WiFi, so ${bridge.espnow} is out of its reach; BLE is the only
; radio both families carry. A ThinkNode M1 running
; ThinkNode_M1_repeater_bridge_ble and a ThinkNode M5 running this env, with the
; same `bridge.secret`, form one bridge group: same frame, same group marker,
; same beacon record, same GATT UUIDs, same timers.
;
; NimBLE, and not the Bluedroid stack every other M5 env uses. One call to
; Bluedroid's createServer() drags in about 94KB of unused ESP-BLE-MESH models
; through the static dispatch table in btc_task.c, which is not a price a
; repeater on this part can pay. The two host stacks cannot be present in one
; binary, so this is a SEPARATE env on purpose: nothing that works today can
; regress, and the stack is proved on hardware before anything else depends on
; it. Porting SerialBLEInterface to NimBLE -- where the measured 394KB saving
; actually lands -- is a later and separate decision.
;
; The library version is pinned exactly. 2.5.1 is the maintained line; 1.4.x saw
; its last release in November 2024. 2.x carries explicit paths for ESP-IDF 4.x,
; which is what the Arduino core this tree pins (2.0.17) is built on, and it has
; the asynchronous connect that NimBleLinkBackend needs -- a blocking connect
; would stall the main loop, and thus the mesh, for as long as a peer took to
; answer. A floating version would let a release change the radio behaviour of a
; shipped node.
;
; Deliberately NOT set here:
;   DISPLAY_CLASS    - the base env sets it and build_unflags takes it away.
;                      GxEPD2 and its fonts are 100KB that a bridge does not use.
;   a BLE CLI        - this bridge owns the advertiser, exactly as it does on
;                      nRF52. On ESP32 it is stronger than a rule about
;                      ownership: SerialBLEInterface is Bluedroid, and Bluedroid
;                      cannot be linked beside NimBLE at all. BLE_LINK_SILENT_SWEEP
;                      therefore stays on, because there is no CLI client that
;                      the sweep could mistake for a silent peer.
;   LOOP_WATCHDOG_MS - LoopWatchdog drives the nRF52 WDT peripheral. The ESP32
;                      has its own task watchdog and a port belongs in
;                      src/helpers/esp32, not in a build flag here.
;   WITH_STATUS_LED  - the M5 LEDs hang on the PCA9557 I2C expander, and
;                      StatusLed writes pinMode and analogWrite to a GPIO.

[env:ThinkNode_M5_repeater_bridge_ble]
extends = ThinkNode_M5
; The bridge, NimBLE and the mesh do not fit the 1,310,720 B that the stock
; 4 MB table gives each OTA slot. min_spiffs.csv is a stock table of the
; platform and is already used by four variants in this tree; it moves each slot
; to 1,966,080 B and leaves 131,072 B of SPIFFS, which is far more than the
; identity, the preferences and the ACL need. huge_app.csv would give 3 MB and
; delete the second OTA slot, and a repeater on a mast is exactly the node that
; must be able to accept an over-the-air image.
board_build.partitions = min_spiffs.csv
build_unflags = -D DISPLAY_CLASS=GxEPDDisplay
build_flags =
  ${ThinkNode_M5.build_flags}
  ${bridge.ble_nimble}
  -D ADVERT_NAME='"ThinkNode M5 BLE Bridge"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  ; Peripheral 2: one for a peer that dials IN, and one spare, because the
  ; address tie-break means the higher address must be able to accept.
  ; Central 2: one outward link is all a two-node bridge needs, with one spare.
  -D BLE_PRPH_SLOTS=2
  -D BLE_CENTRAL_SLOTS=2
  ; NimBLE sizes its connection pool at build time and defaults to 3. BleLink
  ; will make up to BLE_LINK_MAX_LINKS (3) clients and the server needs one
  ; handle for the inbound peer, so 4 is the honest number. Below it,
  ; NimBleStack::ensure() gives up outward slots rather than promise a link the
  ; node cannot hold.
  -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=4
  -D LORA_WATCHDOG_MS=900000       ; probe the radio after 15 min with no airtime
  ;-D BRIDGE_DEBUG=1
  ;-D BLE_DISCOVERY_DEBUG_LOGGING=1
build_src_filter = ${ThinkNode_M5.build_src_filter}
  -<helpers/ui/GxEPDDisplay.cpp>
  +<helpers/esp32/NimBleStack.cpp>
  +<helpers/esp32/NimBleDiscovery.cpp>
  +<helpers/esp32/NimBleLinkBackend.cpp>
  +<helpers/bridges/BleLink.cpp>
  +<helpers/bridges/BLEBridge.cpp>
  +<../examples/simple_repeater/*.cpp>
lib_deps =
  ${ThinkNode_M5.lib_deps}
  ${esp32_ota.lib_deps}
  h2zero/NimBLE-Arduino @ 2.5.1
