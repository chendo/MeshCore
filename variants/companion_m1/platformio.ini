; ThinkNode M1 as a MeshCore COMPANION, with a paged UI of our own.
;
; The M1 is a handheld: the phone app is the user, so the node runs upstream's
; companion_radio unchanged. Nothing in examples/companion_radio/ is edited or
; copied -- main.cpp does `#include "UITask.h"`, which the include path
; resolves, so swapping ui-new for ui-paged is a -I and a source filter and
; nothing more. ui-orig, ui-new and ui-tiny already work exactly this way.
;
; What this env changes against ThinkNode_M1_companion_radio_ble:
;   - ui-paged instead of ui-new (PagedScreen, the neighbours table, recent
;     messages, radio readout, GPS, power-off)
;   - WRAPPER_CLASS points at ObservingSX1262Wrapper, so raw frames reach a
;     MeshObserver. Nothing else feeds one on a single-identity node, and the
;     neighbours page has nothing to show without it.
;
; WARNING: -include does not make PlatformIO rebuild when the header changes.
; After editing src/helpers/ObservingWrapper.h run `-t clean`, or you will flash
; the previous build and debug a ghost.
[env:ThinkNode_M1_companion_paged]
extends = ThinkNode_M1
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_unflags =
  -D WRAPPER_CLASS=CustomSX1262Wrapper
build_flags =
  ${ThinkNode_M1.build_flags}
  -I src/helpers/ui
  -I examples/companion_radio/ui-paged
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  ; Same as the stock BLE env. Without it the node is silent on serial, which
  ; makes "running fine" and "crashed" look identical from the bench.
  -D BLE_DEBUG_LOGGING=1
  -D DISPLAY_ROTATION=4
  -D DISPLAY_CLASS=GxEPDDisplay
  -D OFFLINE_QUEUE_SIZE=256
  -D PIN_BUZZER=6
  -D AUTO_SHUTDOWN_MILLIVOLTS=3300
  -D QSPIFLASH=1
  -D ENV_INCLUDE_GPS=1
  ; The function button is P1.07 = 39, per Elecrow's own datasheet
  ; ("Function Button FK BUTTON_TOUCH P1.07"). variant.h says PIN_BUTTON2 is 11,
  ; which is wrong: pin 11 produced no edge in a full press test under either
  ; pull configuration, and nothing upstream reads it on this board. Our own
  ; macro rather than -D PIN_BUTTON2, which would clash with the variant define.
  -D UI_BUTTON2_PIN=39
  ; The observer tap, via the established *_CLASS idiom.
  -D WRAPPER_CLASS=ObservingSX1262Wrapper
; Project sources only. In build_flags this would also hit library sources,
; which carry no -I src and fail on the header's first include.
build_src_flags =
  -include src/helpers/ObservingWrapper.h
build_src_filter = ${ThinkNode_M1.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<helpers/ui/GxEPDDisplay.cpp>
  +<helpers/ui/buzzer.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/ui/PagedScreen.cpp>
  +<helpers/ui/NeighboursScreen.cpp>
  +<helpers/ObserverNeighbours.cpp>
  +<helpers/ObservingWrapper.cpp>
  +<helpers/MeshObserver.cpp>
  +<helpers/PowerMonitor.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-paged/*.cpp>
lib_deps =
  ${ThinkNode_M1.lib_deps}
  densaugeo/base64 @ ~1.4.0
  zinggjm/GxEPD2 @ 1.6.2
  bakercp/CRC32 @ ^2.0.0
  end2endzone/NonBlockingRTTTL@^1.3.0
