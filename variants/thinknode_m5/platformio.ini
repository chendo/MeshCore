; Hydra: several mesh identities over one LoRa radio (examples/hydra).
; Slot 0 is the stock simple_repeater MyMesh, reused as-is: its MyMesh.cpp is
; compiled in and its directory is put on the include path. Its main.cpp is
; excluded, because hydra brings its own setup() and loop().
;
; The portable parts of hydra run here. SharedRadio, MeshObserver, LoraWatchdog
; and the slot code hold no nRF52 code. LoopWatchdog and I2CBusRecovery are
; nRF52 only, and examples/hydra/main.cpp compiles them only when the build asks
; for them, so this env leaves LOOP_WATCHDOG_MS unset. The Bluetooth bridge
; needs the SoftDevice, so the M5 cannot have it; ${bridge.espnow} is the
; counterpart that this board can run.
;
; Deliberately NOT set here:
;   DISPLAY_CLASS    - the base env sets it, and build_unflags takes it away
;                      again. PlatformIO emits every -D after every -U, so a -U
;                      in build_flags cannot cancel a -D from the parent, and
;                      build_unflags is the only mechanism that works. The M5 has
;                      an e-paper panel, but hydra has no UI yet. A display that
;                      shows the preferences of one identity on a multi-identity
;                      node needs a design first. This also keeps GxEPD2 and its
;                      fonts out of the image.
;   WITH_STATUS_LED  - the LEDs of the M5 hang on the PCA9557 expander, not on a
;                      GPIO. StatusLed writes pinMode and analogWrite, and no
;                      hardware PWM reaches an I2C expander. See the
;                      ThinkNode_M5_Repeater env above.
[env:ThinkNode_M5_hydra]
extends = ThinkNode_M5
; The stock table for 4 MB parts gives each OTA slot 0x140000 = 1,310,720 B, and
; ThinkNode_M5_Repeater already fills 85.9% of one. min_spiffs.csv is a stock
; table of the platform, and four variants in this tree already use it. It moves
; each OTA slot to 0x1E0000 = 1,966,080 B and leaves the SPIFFS at 0x20000 =
; 131,072 B, which is far more than the identities, the preferences, the ACLs
; and /hydra_slots need. huge_app.csv would give 3 MB, but it deletes the second
; OTA slot, and a repeater on a mast is exactly the node that needs to accept an
; over-the-air image. Headroom is worth less than a way back in.
board_build.partitions = min_spiffs.csv
build_unflags = -D DISPLAY_CLASS=GxEPDDisplay
build_flags =
  ${ThinkNode_M5.build_flags}
  -I examples/simple_repeater
  -D ADVERT_NAME='"ThinkNode M5 Hydra"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  ; Five slots, against three on the nRF52 boards. The ESP32-S3 has 524,288 B of
  ; SRAM against 235,520 B. A chat slot costs 9,096 B of static RAM here, which
  ; is 1.7% of this part, where the 5,640 B of an nRF52 slot is 2.4% of that
  ; part. The two extra slots thus cost 18,192 B and 4 B of flash. Above five the
  ; antenna, and not the RAM, is the limit: slot 0 already forwards every flood
  ; that this radio hears, and each extra identity adds only its own advert
  ; schedule to one half-duplex antenna.
  -D HYDRA_NUM_SLOTS=5             ; slot 0 repeater + 4 chat-capable slots
  -D HYDRA_NAME_PREFIX='"hydra"'
  -D MAX_NEIGHBOURS=50             ; slot 0 only (repeater)
  -D MAX_CLIENTS=32                ; slot 0's ACL, and each room slot's own
  ; The dials below are wider than the nRF52 ones, because the RAM allows it.
  -D MAX_UNSYNCED_POSTS=64         ; per room slot, RAM only
  -D HYDRA_RAM_RESERVE=32768       ; node floor: a slot that would breach it is refused
  -D MAX_CONTACTS=32               ; chat slots: stock companion is 350
  -D MAX_CONNECTIONS=8             ; chat slots: stock is 16
  -D HYDRA_CHAT_POOL=12            ; 12 x sizeof(mesh::Packet)=262B vs 32 for slot 0
  -D HYDRA_CHAT_HASHES=64          ; dedup table; SimpleMeshTables uses 160
  ; Node-scoped (HydraNode), from SharedRadioCore::airtimeMs(), and it probes
  ; with the identity of slot 0. One watchdog for the board, not one per slot.
  -D LORA_WATCHDOG_MS=900000
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${ThinkNode_M5.build_src_filter}
  -<helpers/ui/GxEPDDisplay.cpp>
  +<../examples/hydra>
  +<../examples/simple_repeater/MyMesh.cpp>
lib_deps =
  ${ThinkNode_M5.lib_deps}
  ${esp32_ota.lib_deps}
