[ThinkNode_M5]
extends = esp32_base
board = ESP32-S3-WROOM-1-N4
build_flags = ${esp32_base.build_flags}
  -I variants/thinknode_m5
  -I src/helpers/sensors
  -D THINKNODE_M5
  -D PIN_BUZZER=9
  -D PIN_BOARD_SCL=1
  -D PIN_BOARD_SDA=2
  -D P_LORA_EN=46
  -D P_LORA_DIO_1=4
  -D P_LORA_NSS=17
  -D P_LORA_RESET=6  ; RADIOLIB_NC
  -D P_LORA_BUSY=5   ;  DIO2 = 38
  -D P_LORA_SCLK=16
  -D P_LORA_MISO=7
  -D P_LORA_MOSI=15
  -D PIN_USER_BTN=21
  -D PIN_BUTTON2=14
  -D EXP_PIN_LED=1   ; led is on bus expander
  -D DISPLAY_ROTATION=4
  -D DISPLAY_CLASS=GxEPDDisplay
  -D EINK_DISPLAY_MODEL=GxEPD2_154_D67
  -D EINK_SCALE_X=1.5625f
  -D EINK_SCALE_Y=1.5625f
  -D EINK_X_OFFSET=0
  -D EINK_Y_OFFSET=10
  -D BACKLIGHT_BTN=PIN_BUTTON2
  -D AUTO_OFF_MILLIS=0
  -D DISABLE_DIAGNOSTIC_OUTPUT
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=3.3
  -D SX126X_CURRENT_LIMIT=140
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_RX_BOOSTED_GAIN=1
;  -D MESH_DEBUG=1
  -D ENV_INCLUDE_GPS=1
  -D PERSISTANT_GPS=1
  -D ENV_SKIP_GPS_DETECT=1
build_src_filter = ${esp32_base.build_src_filter}
  +<helpers/sensors/EnvironmentSensorManager.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/ui/GxEPDDisplay.cpp>
  +<../variants/thinknode_m5>
lib_deps = ${esp32_base.lib_deps}
  zinggjm/GxEPD2 @ 1.6.2
  bakercp/CRC32 @ ^2.0.0
  maxpromer/PCA9557-arduino
  stevemarple/MicroNMEA @ ^2.0.6

; LOOP_WATCHDOG_MS is absent on purpose. LoopWatchdog is nRF52 code and it drives
; the WDT peripheral of that part. The ESP32 has its own task watchdog, and a
; port belongs in src/helpers/esp32, not in a build flag here.
;
; WITH_STATUS_LED is absent on purpose. The LEDs of the M5 hang on the PCA9557
; I2C expander, and ThinknodeM5Board reaches them with expander.digitalWrite().
; StatusLed writes pinMode() and analogWrite() to a GPIO, and it needs two LEDs
; that it can own. Neither condition holds here: the expander carries no PWM, and
; the blue LED on expander pin 1 is already the LoRa transmit indicator of the
; board. PIN_STATUS_LED in variants/thinknode_m5/variant.h stays commented out
; for the same reason.
[env:ThinkNode_M5_Repeater]
extends = ThinkNode_M5
build_src_filter = ${ThinkNode_M5.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
build_flags =
  ${ThinkNode_M5.build_flags}
  -D ADVERT_NAME='"Thinknode M5 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=8
  -D LORA_WATCHDOG_MS=900000       ; probe the radio after 15 min with no airtime
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
lib_deps =
  ${ThinkNode_M5.lib_deps}
  ${esp32_ota.lib_deps}

