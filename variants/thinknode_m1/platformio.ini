[ThinkNode_M1]
extends = nrf52_base
board = thinknode_m1
board_build.ldscript = boards/nrf52840_s140_v6.ld
build_flags = ${nrf52_base.build_flags}
  -I src/helpers/nrf52
  -I lib/nrf52/s140_nrf52_6.1.1_API/include
  -I lib/nrf52/s140_nrf52_6.1.1_API/include/nrf52
  -I variants/thinknode_m1
  -D THINKNODE_M1=1
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D P_LORA_DIO_1=20
  -D P_LORA_NSS=24
  -D P_LORA_RESET=25
  -D P_LORA_BUSY=17
  -D P_LORA_SCLK=19
  -D P_LORA_MISO=23
  -D P_LORA_MOSI=22
  -D SX126X_POWER_EN=37
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D LORA_TX_POWER=22
  -D P_LORA_TX_LED=13
build_src_filter = ${nrf52_base.build_src_filter}
  +<helpers/*.cpp>
  +<ThinkNodeM1Board.cpp>
  +<../variants/thinknode_m1>
lib_deps =
  ${nrf52_base.lib_deps}
  stevemarple/MicroNMEA @ ^2.0.6
debug_tool = jlink
upload_protocol = nrfutil

; WITH_STATUS_LED is absent on purpose. StatusLed drives two LEDs with hardware
; PWM, and the M1 has one LED that this firmware can own: the green LED on P0.13,
; which ThinkNodeM1Board already lights for each LoRa transmit. The other LED is
; the red charge indicator on P1.04, and the charger blinks it in hardware. The
; LED_RED, LED_GREEN and LED_BLUE values in variants/thinknode_m1/variant.h come
; from a Seeed template. They collide with PIN_SPI1_MISO, PIN_GPS_PPS and
; PIN_NEOPIXEL in the same file, so do not build a status LED on them.
[env:ThinkNode_M1_repeater]
extends = ThinkNode_M1
build_flags =
  ${ThinkNode_M1.build_flags}
  -D ADVERT_NAME='"ThinkNode Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D LOOP_WATCHDOG_MS=30000
  -D LORA_WATCHDOG_MS=900000       ; probe the radio after 15 min with no airtime
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${ThinkNode_M1.build_src_filter}
  +<helpers/nrf52/LoopWatchdog.cpp>
  +<../examples/simple_repeater/*.cpp>
lib_deps =
  ${ThinkNode_M1.lib_deps}

[env:ThinkNode_M1_room_server]
extends = ThinkNode_M1
build_flags =
  ${ThinkNode_M1.build_flags}
  -D ADVERT_NAME='"ThinkNode Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${ThinkNode_M1.build_src_filter}
  +<../examples/simple_room_server/*.cpp>
lib_deps =
  ${ThinkNode_M1.lib_deps}

[env:ThinkNode_M1_companion_radio_ble]
extends = ThinkNode_M1
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_flags =
  ${ThinkNode_M1.build_flags}
  -I src/helpers/ui
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D BLE_DEBUG_LOGGING=1
  -D DISPLAY_ROTATION=4
  -D DISPLAY_CLASS=GxEPDDisplay
  -D OFFLINE_QUEUE_SIZE=256
  -D PIN_BUZZER=6
  -D AUTO_SHUTDOWN_MILLIVOLTS=3300
  -D QSPIFLASH=1
  -D ENV_INCLUDE_GPS=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${ThinkNode_M1.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<helpers/ui/GxEPDDisplay.cpp>
  +<helpers/ui/buzzer.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${ThinkNode_M1.lib_deps}
  densaugeo/base64 @ ~1.4.0
  zinggjm/GxEPD2 @ 1.6.2
  bakercp/CRC32 @ ^2.0.0
  end2endzone/NonBlockingRTTTL@^1.3.0

[env:ThinkNode_M1_companion_radio_usb]
extends = ThinkNode_M1
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_flags =
  ${ThinkNode_M1.build_flags}
  -I src/helpers/ui
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D DISPLAY_ROTATION=4
  -D QSPIFLASH=1
  -D DISPLAY_CLASS=GxEPDDisplay
  -D OFFLINE_QUEUE_SIZE=256
  -D PIN_BUZZER=6
  -D AUTO_SHUTDOWN_MILLIVOLTS=3300
  -D ENABLE_USB_INTERFACE
build_src_filter = ${ThinkNode_M1.build_src_filter}
  +<helpers/ui/GxEPDDisplay.cpp>
  +<helpers/ui/buzzer.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${ThinkNode_M1.lib_deps}
  densaugeo/base64 @ ~1.4.0
  zinggjm/GxEPD2 @ 1.6.2
  bakercp/CRC32 @ ^2.0.0
  end2endzone/NonBlockingRTTTL@^1.3.0

[env:ThinkNode_M1_kiss_modem]
extends = ThinkNode_M1
build_src_filter = ${ThinkNode_M1.build_src_filter}
  +<../examples/kiss_modem/>

; Hydra: several mesh identities over one LoRa radio (examples/hydra).
; The M1 carries the same nRF52840, the same SoftDevice s140 6.1.1 and the same
; 235,520 B of RAM as the RAK3401, so this env is the RAK3401 hydra env with M1
; pins. Slot 0 is the stock simple_repeater MyMesh, reused as-is: its MyMesh.cpp
; is compiled in and its directory is put on the include path. Its main.cpp is
; excluded, because hydra brings its own setup() and loop().
;
; Deliberately NOT set here:
;   DISPLAY_CLASS    - the M1 has an e-paper panel, but hydra has no UI yet. A
;                      display that shows the preferences of one identity on a
;                      multi-identity node needs a design first.
;   WITH_STATUS_LED  - the M1 has one LED that this firmware can own. See the
;                      ThinkNode_M1_repeater env above.
;
; A slot allocates its ACL and its post buffer on the heap when the operator
; enables it, so a configured but inactive room costs nothing. HYDRA_RAM_RESERVE
; is the floor that refuses the last slot when the heap cannot carry it.
[env:ThinkNode_M1_hydra]
extends = ThinkNode_M1
build_flags =
  ${ThinkNode_M1.build_flags}
  -I examples/simple_repeater
  -D ADVERT_NAME='"ThinkNode M1 Hydra"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D HYDRA_NUM_SLOTS=3             ; slot 0 repeater + 2 chat-capable slots
  -D HYDRA_NAME_PREFIX='"hydra"'
  -D MAX_NEIGHBOURS=50             ; slot 0 only (repeater)
  -D MAX_CLIENTS=32                ; slot 0's ACL, and each room slot's own
  -D MAX_UNSYNCED_POSTS=32         ; per room slot, RAM only
  -D HYDRA_RAM_RESERVE=24576       ; node floor: a slot that would breach it is refused
  -D MAX_CONTACTS=16               ; chat slots: stock companion is 350
  -D MAX_CONNECTIONS=4             ; chat slots: stock is 16
  -D HYDRA_CHAT_POOL=8             ; 8 x sizeof(mesh::Packet)=262B vs 32 for slot 0
  -D HYDRA_CHAT_HASHES=32          ; dedup table; SimpleMeshTables uses 160
  -D LOOP_WATCHDOG_MS=30000
  ; Node-scoped (HydraNode), from SharedRadioCore::airtimeMs(), and it probes
  ; with the identity of slot 0. One watchdog for the board, not one per slot.
  -D LORA_WATCHDOG_MS=900000
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${ThinkNode_M1.build_src_filter}
  +<helpers/nrf52/LoopWatchdog.cpp>
  +<../examples/hydra>
  +<../examples/simple_repeater/MyMesh.cpp>
lib_deps =
  ${ThinkNode_M1.lib_deps}

; A repeater that bridges over BLE peer links. Two co-located nodes that run
; this build with the same `bridge.secret` share their LoRa traffic over a BLE
; connection, and they spend no LoRa hop to do it. The M1 has no WiFi, so
; ${bridge.espnow} is not available to it.
;
; Discovery: each node advertises a legacy beacon that carries a two-byte group
; marker derived from the secret, and it dials a node whose beacon matches. The
; marker is public, so the group HMAC on the first frame is what proves
; membership. See src/helpers/bridges/BLEBridge.h.
;
; The frame is PLAINTEXT and authenticated with a truncated HMAC -- see
; src/helpers/bridges/BleBridgeFrame.h. Set the same `bridge.secret` on every
; node in the group; a different secret is what keeps two groups apart.
;
; This bridge owns the BLE stack, so do NOT add a BLE CLI or a companion
; interface to this env. A build that does add one must also set
; -D BLE_LINK_SILENT_SWEEP=0, because the sweep that reclaims the inbound slot
; cannot tell a silent peer from a CLI client that is part way through pairing.
[env:ThinkNode_M1_repeater_bridge_ble]
extends = ThinkNode_M1
build_flags =
  ${ThinkNode_M1.build_flags}
  ${bridge.ble}
  -D ADVERT_NAME='"ThinkNode M1 BLE Bridge"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  ; The M1 grants the same slots as the RAK3401. Both boards link with
  ; boards/nrf52840_s140_v6.ld, so the SoftDevice gets the same 24KB at RAM
  ; origin 0x20006000, and both run s140 6.1.1. BleStack::ensure() still finds
  ; the true ceiling at boot and steps down to what fits, so these two numbers
  ; are a request and never an assumption. Peripheral 2: the CLI/DFU port, plus
  ; one slot for a peer that dials IN, because the address tie-break means the
  ; higher address must be able to accept. Central 2: one outward link is all a
  ; two-node bridge needs, with one spare.
  -D BLE_PRPH_SLOTS=2
  -D BLE_CENTRAL_SLOTS=2
  -D LOOP_WATCHDOG_MS=30000
  -D LORA_WATCHDOG_MS=900000       ; probe the radio after 15 min with no airtime
;  -D BRIDGE_DEBUG=1
;  -D BLE_DISCOVERY_DEBUG_LOGGING=1
build_src_filter = ${ThinkNode_M1.build_src_filter}
  +<helpers/nrf52/LoopWatchdog.cpp>
  +<helpers/nrf52/BleStack.cpp>
  +<helpers/nrf52/BleDiscovery.cpp>
  +<helpers/nrf52/BleLink.cpp>
  +<helpers/bridges/BLEBridge.cpp>
  +<../examples/simple_repeater/*.cpp>
lib_deps =
  ${ThinkNode_M1.lib_deps}
