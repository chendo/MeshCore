[rak3401]
extends = nrf52_base
board = rak3401
board_check = true
build_flags = ${nrf52_base.build_flags}
  ${sensor_base.build_flags}
  -I variants/rak3401
  -D RAK_3401
  -D NRF52_POWER_MANAGEMENT
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D SX126X_REGISTER_PATCH=1       ; Patch register 0x8B5 for improved RX with SKY66122 FEM
build_src_filter = ${nrf52_base.build_src_filter}
  +<../variants/rak3401>
  +<helpers/sensors>
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
lib_deps =
  ${nrf52_base.lib_deps}
  ${sensor_base.lib_deps}
  adafruit/Adafruit SSD1306 @ ^2.5.13
  sparkfun/SparkFun u-blox GNSS Arduino Library@^2.2.27

[env:RAK_3401_repeater]
extends = rak3401
build_flags =
  ${rak3401.build_flags}
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"RAK3401 1W Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D LOOP_WATCHDOG_MS=30000
  -D WITH_STATUS_LED=1
  -D LORA_WATCHDOG_MS=900000       ; probe the radio after 15 min with no airtime
  ;-D MESH_PACKET_LOGGING=1
  ;-D MESH_DEBUG=1
build_src_filter = ${rak3401.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/nrf52/LoopWatchdog.cpp>
  +<helpers/StatusLed.cpp>
  +<../examples/simple_repeater>

; A repeater that bridges over BLE peer links. Two co-located nodes that run
; this build with the same `bridge.secret` share their LoRa traffic over a BLE
; connection and spend no LoRa hop to do it. This is the nRF52 counterpart to
; ${bridge.espnow}, which the RAK3401 cannot use because it has no WiFi.
;
; Discovery: each node advertises a legacy beacon that carries a two-byte group
; marker derived from the secret, and it dials a node whose beacon matches. The
; marker is public, so the group HMAC on the first frame is what proves
; membership. See src/helpers/bridges/BLEBridge.h.
;
; The frame is PLAINTEXT and authenticated with a truncated HMAC -- see
; src/helpers/bridges/BleBridgeFrame.h. Set the same `bridge.secret` on every
; node in the group; a different secret is what keeps two groups apart.
;
; This bridge owns the BLE stack, so do NOT add a BLE CLI or a companion
; interface to this env.
[env:RAK_3401_repeater_bridge_ble]
extends = rak3401
build_flags =
  ${rak3401.build_flags}
  ${bridge.ble}
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"RAK3401 BLE Bridge"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  ; Ask for what a bridge uses, so the RAM ladder in BleStack can spend the
  ; saving on buffers. Peripheral 2: the CLI/DFU port, plus one slot for a peer
  ; that dials IN, because the address tie-break means the higher address must
  ; be able to accept. Central 2: one outward link is all a two-node bridge
  ; needs, with one spare.
  -D BLE_PRPH_SLOTS=2
  -D BLE_CENTRAL_SLOTS=2
  -D LOOP_WATCHDOG_MS=30000
  -D LORA_WATCHDOG_MS=900000       ; probe the radio after 15 min with no airtime
  -D WITH_STATUS_LED=1
  ;-D BRIDGE_DEBUG=1
  ;-D BLE_DISCOVERY_DEBUG_LOGGING=1
build_src_filter = ${rak3401.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/StatusLed.cpp>
  +<helpers/nrf52/LoopWatchdog.cpp>
  +<helpers/nrf52/BleStack.cpp>
  +<helpers/nrf52/BleDiscovery.cpp>
  +<helpers/nrf52/BleLink.cpp>
  +<helpers/bridges/BLEBridge.cpp>
  +<../examples/simple_repeater>

; Hydra: several mesh identities over one LoRa radio (examples/hydra).
; Slot 0 is the stock simple_repeater MyMesh, reused as-is: its MyMesh.cpp is
; compiled in and its directory put on the include path, so no fork and no
; edits there. Its main.cpp is excluded — hydra has its own setup()/loop().
;
; Deliberately NOT set here:
;   DISPLAY_CLASS    - no UI yet; a display showing one identity's prefs on a
;                      multi-identity node needs a design first.
;
; A slot's ACL and post buffer are heap-allocated when the slot is ENABLED, so
; a configured-but-off room costs nothing; HYDRA_RAM_RESERVE is what stops the
; last one being enabled into a heap that cannot carry it.
[env:RAK_3401_hydra]
extends = rak3401
build_flags =
  ${rak3401.build_flags}
  -I examples/simple_repeater
  -D ADVERT_NAME='"RAK3401 Hydra"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D HYDRA_NUM_SLOTS=3             ; slot 0 repeater + 2 chat-capable slots
  -D HYDRA_NAME_PREFIX='"hydra"'
  -D MAX_NEIGHBOURS=50             ; slot 0 only (repeater)
  -D MAX_CLIENTS=32                ; slot 0's ACL, and each room slot's own
  -D MAX_UNSYNCED_POSTS=32         ; per room slot, RAM only (decision G)
  -D HYDRA_RAM_RESERVE=24576       ; node floor: a slot that would breach it is refused
  -D MAX_CONTACTS=16               ; chat slots: stock companion is 350
  -D MAX_CONNECTIONS=4             ; chat slots: stock is 16
  -D HYDRA_CHAT_POOL=8             ; 8 x sizeof(mesh::Packet)=260B vs 32 for slot 0
  -D HYDRA_CHAT_HASHES=32          ; dedup table; SimpleMeshTables uses 160
  -D LOOP_WATCHDOG_MS=30000
  -D WITH_STATUS_LED=1
  ; Node-scoped (HydraNode), reasoning from SharedRadioCore::airtimeMs() and
  ; probing with slot 0's identity — one watchdog for the board, not one per slot.
  -D LORA_WATCHDOG_MS=900000
  ;-D MESH_PACKET_LOGGING=1
  ;-D MESH_DEBUG=1
build_src_filter = ${rak3401.build_src_filter}
  +<helpers/nrf52/LoopWatchdog.cpp>
  +<helpers/StatusLed.cpp>
  +<../examples/hydra>
  +<../examples/simple_repeater/MyMesh.cpp>

[env:RAK_3401_room_server]
extends = rak3401
build_flags =
  ${rak3401.build_flags}
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"Test Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
  ;-D MESH_PACKET_LOGGING=1
  ;-D MESH_DEBUG=1
build_src_filter = ${rak3401.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_room_server>

[env:RAK_3401_companion_radio_usb]
extends = rak3401
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_flags =
  ${rak3401.build_flags}
  -I examples/companion_radio/ui-new
  -D PIN_USER_BTN_ANA=31
  -D DISPLAY_CLASS=SSD1306Display
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D ENABLE_USB_INTERFACE
; NOTE: DO NOT ENABLE -->  -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_DEBUG=1
build_src_filter = ${rak3401.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${rak3401.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:RAK_3401_companion_radio_ble]
extends = rak3401
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_flags =
  ${rak3401.build_flags}
  -I examples/companion_radio/ui-new
  -D PIN_USER_BTN_ANA=31
  -D DISPLAY_CLASS=SSD1306Display
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D BLE_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=256
  ;-D MESH_PACKET_LOGGING=1
  ;-D MESH_DEBUG=1
build_src_filter = ${rak3401.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${rak3401.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:RAK_3401_terminal_chat]
extends = rak3401
build_flags =
  ${rak3401.build_flags}
  -D MAX_CONTACTS=100
  -D MAX_GROUP_CHANNELS=1
  ;-D MESH_PACKET_LOGGING=1
  ;-D MESH_DEBUG=1
build_src_filter = ${rak3401.build_src_filter}
  +<../examples/simple_secure_chat/main.cpp>
lib_deps =
  ${rak3401.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:RAK_3401_sensor]
extends = rak3401
build_flags =
